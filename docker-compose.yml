services:
  app:
    build: .
    container_name: wa-app
    restart: unless-stopped
    env_file: .env
    volumes:
      # Reply history must survive container rebuilds/restarts — bind-mount it.
      - ./numbers:/app/numbers
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: wa-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
